<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Players | Homebrew Hub</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="icon" href="../Images/Shield.png" type="image/png">
    <link rel="icon" href="../Images/Shield.png" type="image/png">
</head>
<body>
    <main class="campaign-page">
        <section class="page-card player-page">
            <p><a href="../homePage.html">Home</a> | <a href="Campaigns.html">Campaigns</a></p>
            <h1>Players</h1>
            <p class="intro">Create and save players so they can be added to campaigns.</p>

            <form id="player-form" class="player-form" aria-label="Create Player Form">
                <div>
                    <label for="player-name">Player Name:</label>
                    <input type="text" id="player-name" name="player-name" required>
                </div>
                <div>
                    <label for="character-name">Character Name:</label>
                    <input type="text" id="character-name" name="character-name" required>
                </div>
                <div>
                    <label for="player-class">Class:</label>
                    <input type="text" id="player-class" name="player-class" required>
                </div>
                <div>
                    <label for="player-level">Level:</label>
                    <input type="number" id="player-level" name="player-level" min="1" max="20" value="1" required>
                </div>
                <div>
                    <label for="player-max-hp">Max HP:</label>
                    <input type="number" id="player-max-hp" name="player-max-hp" min="1" required>
                </div>
                <div>
                    <label for="player-ac">Armor Class:</label>
                    <input type="number" id="player-ac" name="player-ac" min="1" required>
                </div>
                <fieldset class="player-attributes">
                    <legend>Attributes</legend>
                    <div>
                        <label for="player-strength">Strength:</label>
                        <input type="number" id="player-strength" name="player-strength" min="1" max="30" value="10" required>
                    </div>
                    <div>
                        <label for="player-dexterity">Dexterity:</label>
                        <input type="number" id="player-dexterity" name="player-dexterity" min="1" max="30" value="10" required>
                    </div>
                    <div>
                        <label for="player-constitution">Constitution:</label>
                        <input type="number" id="player-constitution" name="player-constitution" min="1" max="30" value="10" required>
                    </div>
                    <div>
                        <label for="player-intelligence">Intelligence:</label>
                        <input type="number" id="player-intelligence" name="player-intelligence" min="1" max="30" value="10" required>
                    </div>
                    <div>
                        <label for="player-wisdom">Wisdom:</label>
                        <input type="number" id="player-wisdom" name="player-wisdom" min="1" max="30" value="10" required>
                    </div>
                    <div>
                        <label for="player-charisma">Charisma:</label>
                        <input type="number" id="player-charisma" name="player-charisma" min="1" max="30" value="10" required>
                    </div>
                </fieldset>
                <div class="player-form-action">
                    <button type="submit">Save Player</button>
                </div>
                <div class="player-form-action player-clone-action">
                    <label for="prepopulate-clone-select">Clone Player:</label>
                    <div class="player-clone-controls">
                        <select id="prepopulate-clone-select" name="prepopulate-clone">
                            <option value="">Select a player to clone</option>
                        </select>
                        <button type="button" id="prepopulate-clone">Clone</button>
                    </div>
                </div>
                <p id="player-form-status" class="player-save-status" aria-live="polite"></p>
            </form>

            <h2>Saved Players</h2>
            <div id="saved-players" class="player-cards" aria-live="polite"></div>
        </section>
    </main>
    <script src="../Javascript/Players.js"></script>
</body>
</html>
